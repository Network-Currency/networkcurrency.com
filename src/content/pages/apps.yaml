headline: Micro apps for real problems.
intro: |
  Modern tools make app delivery a completely new ballgame.  Lightning fast delivery of 100% custom functionality is within reach of people inside and outside traditional tecnnical roles.  But there's much more to successful software than just the code.  

  I combine hands-on familiarity with modern tools and decades of experience bringing solutions of all types to market, on time and on budget.  Whether it's a fit-to-purpose governance solution for your entire company to operate, or tiny apps that do one thing very well, I can help from concept to go-live.
