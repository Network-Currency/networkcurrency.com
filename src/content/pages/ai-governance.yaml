eyebrow: AI Governance
headline: You can't build governance without a template, but you can't operate a template.
intro:
  - "The fundamental practices of technology control haven't changed, but the landscape has.  Consumption economics, unpredictable results, and dramatically lower barriers to entry have made the old playbooks obsolete."
  - "Now more than ever, clear technology controls must be custom fit to your organization.  How does your company make decisions?  What do you need more, control or acceleration?  How much operational drag is tolerable?  I know the questions to ask, and I can help you answer them."
